name: Deploy Backend to Azure

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        cd backend
        uv pip install -r requirements.txt
        uv pip install gunicorn

    - name: Create deployment package
      run: |
        cd backend
        # Create a virtual environment and install dependencies
        python -m venv venv
        source venv/bin/activate
        uv pip install -r requirements.txt
        uv pip install gunicorn
        # Create deployment package including the virtual environment
        zip -r ../deployment.zip . -x "*.git*" "*.pyc" "__pycache__/*"

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: mda-horizon-backend-2025
        slot-name: production
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: deployment.zip

    - name: Install dependencies in Azure
      uses: azure/webapps-deploy@v2
      with:
        app-name: mda-horizon-backend-2025
        slot-name: production
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: deployment.zip
        startup-command: |
          cd /home/site/wwwroot
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install gunicorn
          python -m gunicorn --config gunicorn.conf.py api:app 