name: API Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        cd backend
        pip install -r requirements.txt

    - name: Create necessary directories
      run: |
        mkdir -p backend/data/pdf
        mkdir -p backend/chroma

    - name: Copy test data
      run: |
        # Add commands to copy test PDF files if needed
        touch backend/data/pdf/sample.pdf

    - name: Run tests
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        CHROMA_PATH: chroma
        DATA_PATH: data/pdf
      run: |
        cd backend
        pytest tests/ -v

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v2
      with:
        name: test-results
        path: backend/test-results/ 